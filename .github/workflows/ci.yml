name: M0 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bigant
          POSTGRES_PASSWORD: bigant_ci
          POSTGRES_DB: bigant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bigant -d bigant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bigant:bigant_ci@localhost:5432/bigant_test?schema=public
      TEST_DATABASE_URL: postgresql://bigant:bigant_ci@localhost:5432/bigant_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
